<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주식 본전 회복 계산기</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font:16px/1.6 system-ui,sans-serif}main{max-width:560px;margin:24px auto;padding:24px;background:white;border-radius:20px;box-shadow:0 8px 32px #14243a12}h1{font-size:26px;line-height:1.3;margin:0}p{color:#536174}label{display:block;font-weight:700;margin-top:20px}input[type=number]{width:100%;padding:14px;border:1px solid #aebacc;border-radius:10px;font:inherit;margin-top:6px}input[type=range]{width:100%;accent-color:#2563eb;margin-top:16px}.result{background:#eef4ff;border-radius:14px;padding:20px;margin-top:20px}.big{font-size:36px;font-weight:800;color:#b42318;overflow-wrap:anywhere}dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #dbe4f2}dd{margin:0;font-weight:700;text-align:right}button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:white;font:inherit;cursor:pointer;margin-top:16px}small{display:block;color:#536174;margin-top:16px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid #e2e8f0;text-align:right}th{background:#f1f5f9}h2{font-size:19px}@media(max-width:600px){main{margin:12px;padding:18px}}</style></head><body><main><h1>주식 본전 회복 계산기</h1><p>현재 손실률에서 원금을 회복하려면 얼마나 올라야 할까요?</p><label for="money">최초 투자금 (원)</label><input id="money" type="number" min="1" step="1" value="1000000" inputmode="numeric"><label for="loss">현재 손실률 (%, 양수 또는 음수 입력)</label><input id="loss" type="number" min="-100" max="100" step="any" value="30" inputmode="decimal"><input id="slider" aria-label="손실률 조절" type="range" min="0" max="100" step="0.1" value="30"><section class="result" aria-live="polite"><div>본전까지 필요한 상승률</div><div class="big" id="rise"></div><dl><div><dt>현재 평가금액</dt><dd id="current"></dd></div><div><dt>평가손실</dt><dd id="damage"></dd></div><div><dt>목표 회복 금액</dt><dd id="target"></dd></div></dl></section><button id="reset">초기화</button><small>계산 공식: 손실률 ÷ (100 − 손실률) × 100<br>수수료, 세금, 배당금 및 추가 매수는 제외합니다. 100% 손실은 동일 투자금 기준 상승률로 회복할 수 없습니다.</small><h2>손실률별 본전 회복 상승률</h2><table><thead><tr><th>손실률</th><th>필요 상승률</th></tr></thead><tbody id="rows"></tbody></table></main><script>const $=id=>document.getElementById(id), fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원', pct=n=>n.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})+'%';function update(){const p=Number($('money').value),l=Math.abs(Number($('loss').value));const ok=$('money').value!==''&&$('loss').value!==''&&Number.isFinite(p)&&p>0&&Number.isFinite(l)&&l<=100;if(!ok){$('rise').textContent='입력값을 확인하세요';for(const id of ['current','damage','target'])$(id).textContent='—';return;}$('slider').value=l;$('rise').textContent=l===100?'회복 불가능':'+'+pct(l/(100-l)*100);$('current').textContent=fmt(p*(100-l)/100);$('damage').textContent=fmt(p*l/100);$('target').textContent=fmt(p);}for(const id of ['money','loss'])$(id).addEventListener('input',update);$('slider').addEventListener('input',()=>{$('loss').value=$('slider').value;update()});$('reset').addEventListener('click',()=>{$('money').value=1000000;$('loss').value=30;update()});for(let l=5;l<=100;l+=5){const tr=document.createElement('tr');for(const v of ['-'+l+'%',l===100?'회복 불가능':'+'+pct(l/(100-l)*100)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}update();</script></body></html>
